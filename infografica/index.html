<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TPER, la strada del dato</title>
<meta name="description" content="Il progetto di data governance TPER sull'area vendite in una sola scena: otto domande da aprire in ordine, con le schermate della piattaforma ridisegnate.">
<meta name="color-scheme" content="light">
<style>
@font-face{font-family:"Poppins";font-style:normal;font-weight:400;font-display:swap;src:url("fonts/poppins-400-latin-ext.woff2") format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C4,U+2113,U+2C60-2C7F,U+A720-A7FF}

@font-face{font-family:"Poppins";font-style:normal;font-weight:600;font-display:swap;src:url("fonts/poppins-600-latin.woff2") format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

@font-face{font-family:"Poppins";font-style:normal;font-weight:900;font-display:swap;src:url("fonts/poppins-900-latin.woff2") format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

@font-face{font-family:"Caveat Brush";font-style:normal;font-weight:400;font-display:swap;src:url("fonts/caveat-brush-400-latin.woff2") format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{
  --board:#ffffff;
  --board-2:#f2f3f4;
  --ink:#1b1b1d;         /* pennarello nero */
  --ink-2:#44464c;
  --ink-3:#62656d;
  --red:#ef343c;         /* rosso TPER, per il tratto */
  --red-ink:#c61f27;     /* lo stesso rosso, più scuro, per il testo */
  --sans:"Poppins",system-ui,sans-serif;
  --hand:"Caveat Brush","Comic Sans MS",cursive;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
html{font-size:clamp(16px,.55vw + 10px,21px);color-scheme:light;scrollbar-color:var(--ink-3) var(--board-2)}
body{margin:0;background:var(--board);color:var(--ink);font-family:var(--sans);font-size:1rem;line-height:1.5;font-feature-settings:"tnum" 1;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}
::selection{background:var(--red);color:#fff}
:focus-visible{outline:3px solid var(--red);outline-offset:4px;border-radius:4px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
h1,h2,h3{margin:0;font-weight:900;line-height:1.13;letter-spacing:-.01em;word-spacing:.14em;text-wrap:balance}
p{margin:0;text-wrap:pretty}
ul,ol{margin:0;padding:0;list-style:none}
img{display:block;max-width:100%}

/* ----- il tratto: lo stesso pennarello della pagina a scorrimento, più leggero ----- */
svg.mk{overflow:visible;fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;filter:url(#rough)}
svg.mk.red,svg.mk .red{stroke:var(--red)}
svg.mk.stretch path{vector-effect:non-scaling-stroke}
svg.mk .fill{fill:var(--ink)}
svg.mk .fillr{fill:var(--red)}
svg.mk .paper{fill:var(--board)}
svg.mk text{font-family:var(--hand);font-size:22px;fill:var(--ink-2);stroke:none}
.hand{font-family:var(--hand);font-weight:400;line-height:1.05;letter-spacing:.005em}
.fr{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.num{position:relative;flex:none;display:grid;place-items:center;width:2.4rem;height:2.4rem;font-family:var(--hand);font-size:1.5rem;line-height:1}
.num svg{position:absolute;inset:0;width:100%;height:100%}
.num b{position:relative;font-weight:400;transform:translateY(-.05em)}
.num.big{width:4.4rem;height:4.4rem;font-size:2.6rem}
.circled{position:relative;white-space:nowrap;z-index:0;padding:.02em .06em}
.circled svg{position:absolute;left:-5%;top:-4%;width:110%;height:110%;z-index:-1;stroke-width:5}

/* ----- intestazione: nessun menu, solo la domanda e il conto delle fermate ----- */
.hd{display:flex;align-items:center;gap:1.6rem;padding:.8rem 2rem .3rem;max-width:104rem;width:100%;margin:0 auto}
.hd .logo{height:2.3rem;width:auto;flex:none}
.hd h1{font-size:1.75rem;flex:1 1 auto;max-width:44rem}
.hd .how{margin-left:auto;text-align:right;font-size:1.4rem;color:var(--red-ink);rotate:-2deg;flex:none}
.dots{display:flex;gap:.25rem;flex:none}
.dots svg{display:block;width:1.15rem;height:1.15rem;stroke-width:5}
.dots li.on svg{fill:var(--red)}

/* ----- la scena ----- */
.scene{flex:1;display:flex;flex-direction:column;justify-content:center;padding:2.6rem 2rem 2.6rem;max-width:104rem;width:100%;margin:0 auto;position:relative}
.cols{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));column-gap:1rem}
.lots{position:relative;grid-template-rows:auto auto 5rem auto}
.lot{position:relative;display:grid;grid-template-rows:subgrid;grid-row:1 / span 4;grid-column:var(--c)}
.lot>*{grid-column:1}
.stage{display:block;grid-row:1;padding:0 .4rem .3rem 0}
.stage b{display:block;font-weight:900;font-size:1.25rem;line-height:1.1;letter-spacing:-.01em;word-spacing:.14em}
.stage i{display:block;font-style:normal;font-family:var(--hand);font-size:1.3rem;line-height:1.05;color:var(--red-ink);margin-top:.1rem}
.lot svg.dw{display:block;grid-row:2;align-self:end;width:100%;height:auto;transition:translate .35s var(--ease)}
.lot:hover svg.dw,.lot:focus-visible svg.dw{translate:0 -5px}
.tile{position:relative;display:block;grid-row:4;padding:1.2rem .5rem .5rem;min-height:4.7rem;text-align:center}
.tile .num{position:absolute;top:-1.05rem;left:50%;translate:-50% 0;width:2.1rem;height:2.1rem;font-size:1.35rem}
.tile .num>svg{fill:var(--board)}
.tile svg.str{position:absolute;left:50%;top:-1.75rem;width:.6rem;height:.8rem;translate:-50% 0;stroke-width:6}
.tile .fr{stroke-width:2.5;transition:stroke .2s var(--ease)}
.lot:hover .tile .fr,.lot:focus-visible .tile .fr,.strip:hover>.fr,.strip:focus-visible>.fr,.is-next .tile .fr,.strip.is-next>.fr{stroke:var(--red)}
.qq{display:block;font-weight:600;font-size:1rem;line-height:1.25}
.done{grid-row:4;justify-self:end;align-self:start;margin:-1.1rem -.35rem 0 0;z-index:1;width:2.2rem;height:2.2rem;opacity:0;scale:.4;rotate:-20deg;transition:opacity .4s var(--ease),scale .6s var(--ease),rotate .6s var(--ease)}
.done svg{width:100%;height:100%;stroke-width:6}
.seen .done{opacity:1;scale:1;rotate:0deg}
.strip .done{position:absolute;top:auto;bottom:-1rem;right:.5rem;margin:0}
.nx{display:none;position:absolute;left:1.6rem;bottom:calc(100% + .45rem);align-items:flex-start;gap:.2rem;font-size:1.3rem;color:var(--red-ink);white-space:nowrap;rotate:-3deg;z-index:2;pointer-events:none}
.nx svg{width:1.5rem;height:1.5rem;stroke-width:3.5;translate:0 .3rem}
.is-next .nx{display:flex}
.strip .nx{bottom:auto;top:calc(100% - .1rem);left:1.2rem;align-items:flex-end;rotate:2deg}
.strip .nx svg{translate:0 -.5rem}

/* la strada: il marciapiede in nero, la mezzeria che scorre, il bordo rosso */
.road{position:relative;grid-column:1 / -1;grid-row:3;align-self:start;height:3.3rem;pointer-events:none}
.road svg.ln{position:absolute;left:0;width:100%;height:1rem}
.road svg.top{top:-.5rem}
.road svg.dash{top:50%;margin-top:-.5rem;opacity:.55}
.road svg.bot{bottom:-.5rem}
.sbus{position:absolute;bottom:.5rem;left:-9%;width:4.6rem}
.sbus svg{display:block;width:100%;height:auto;stroke-width:6}

.along{margin-top:.7rem;align-items:center}
.along .lbl{grid-column:1 / span 2;font-size:1.4rem;color:var(--ink-2);rotate:-2deg;padding-right:.6rem}
.strip{position:relative;display:grid;grid-template-columns:auto auto 1fr;gap:.75rem;align-items:center;padding:.5rem 1rem .5rem .8rem;transition:translate .35s var(--ease)}
.strip:hover,.strip:focus-visible{translate:0 -4px}
.strip>.fr{stroke-width:2.5;transition:stroke .2s var(--ease)}
.strip.s7{grid-column:3 / span 2}
.strip.s8{grid-column:5 / span 3}
.strip svg.ppl{display:block;height:3.5rem;width:auto}

/* ----- la tavola: l'edificio si apre ----- */
.plate{position:fixed;inset:0;z-index:20;background:var(--board);overflow:auto;visibility:hidden;clip-path:circle(0 at var(--ox,50%) var(--oy,50%));transition:clip-path .75s var(--ease),visibility 0s .75s}
.plate.open{visibility:visible;clip-path:circle(150% at var(--ox,50%) var(--oy,50%));transition:clip-path .75s var(--ease),visibility 0s}
.pl{min-height:100%;display:grid;grid-template-columns:minmax(0,.5fr) minmax(0,1fr);column-gap:2.2rem;row-gap:1rem;align-items:start;align-content:center;padding:1.4rem 2.2rem 1.2rem;max-width:104rem;margin:0 auto;position:relative}
.pl-top{display:flex;align-items:flex-end;gap:1.1rem}
.pl-top svg.dw{height:7rem;width:auto;stroke-width:3.5}
.pl-top svg.dw text,.pl-top svg.dw .lb,.mini7 text,.mini7 .lb{display:none}
.pl-top svg.ppl{height:4.4rem;width:auto}
.pl-txt h2{font-size:1.75rem;margin-top:1rem}
.pl-txt h2:focus{outline:none}
.pl-txt .ans{font-weight:600;font-size:1.125rem;line-height:1.45;margin-top:.9rem;max-width:30rem}
.who{position:relative;display:inline-grid;margin-top:1.2rem;padding:.55rem 1rem .6rem;max-width:30rem}
.who .fr{stroke:var(--red);stroke-width:2.5}
.who b{font-family:var(--hand);font-weight:400;font-size:1.4rem;line-height:1;color:var(--red-ink)}
.who span{font-size:.9375rem;font-weight:600;line-height:1.4;margin-top:.15rem}
.pl-nav{display:flex;flex-wrap:wrap;gap:.8rem;margin-top:1.6rem}
.nb{position:relative;display:inline-flex;align-items:center;gap:.6rem;padding:.6rem 1.1rem;font-weight:600;font-size:1rem}
.nb .fr{stroke-width:3}
.nb svg.ar{width:1.4rem;height:1.4rem;stroke-width:3.5;transition:translate .3s var(--ease)}
.nb:hover{color:var(--red-ink)}
.nb.fw:hover svg.ar{translate:4px 0}
.nb.bk:hover svg.ar{translate:-4px 0}
.nb:disabled{color:var(--ink-3)}
.nb:disabled svg{opacity:.4}
.orig{margin-top:1.3rem;font-size:.875rem;color:var(--ink-2);text-decoration:underline;text-decoration-color:var(--red);text-decoration-thickness:2px;text-underline-offset:.22em}
.orig:hover{color:var(--red-ink)}
.x{position:absolute;right:1.6rem;top:1.1rem;display:flex;align-items:center;gap:.5rem;font-family:var(--hand);font-size:1.4rem;color:var(--ink-2);z-index:3}
.x svg{width:1.5rem;height:1.5rem;stroke-width:4}
.x:hover{color:var(--red-ink)}

/* la schermata ridisegnata */
.fig{position:relative;padding:1.5rem 1.4rem 1.4rem;margin-top:2.5rem}
.fig>.fr{stroke-width:3}
.cap{position:absolute;left:1.4rem;top:-1.05rem;z-index:1;background:var(--board);padding:0 .6rem;font-size:1.3rem;color:var(--ink-2);rotate:-1.5deg}
.a{opacity:0;translate:0 12px;transition:opacity .5s var(--ease),translate .7s var(--ease);transition-delay:calc(var(--i,0) * 90ms + .3s)}
.plate.open .a{opacity:1;translate:0 0}
.bx{position:relative;padding:.9rem 1.1rem 1rem}
.bx>.fr{stroke-width:2.5}
.bx.dsh>.fr path{stroke-dasharray:8 9}
.bx h3{font-size:1.25rem}
.sub{font-size:.9375rem;color:var(--ink-2);line-height:1.4}
.tech{font-size:.8125rem;color:var(--ink-3)}
.note{font-family:var(--hand);font-size:1.4rem;line-height:1.1;color:var(--red-ink)}
.tagc{position:relative;display:inline-block;padding:.1rem .7rem .15rem;font-family:var(--hand);font-size:1.3rem;line-height:1.2;white-space:nowrap}
.tagc .fr{stroke-width:2}
.stamp{position:relative;display:inline-block;padding:.15rem .8rem .2rem;font-family:var(--hand);font-size:1.3rem;line-height:1.15;color:var(--red-ink);rotate:-3deg}
.stamp .fr{stroke:var(--red);stroke-width:2.5}
.stamp:nth-child(even){rotate:2.5deg}
.bar{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:.2rem .5rem;padding:0 0 .7rem;margin-bottom:1rem;font-size:.875rem;line-height:1.3;color:var(--ink-2)}
.bar .rd{font-size:1.3rem;line-height:1;color:var(--red-ink);margin-right:.4rem}
.bar svg.sep{width:.5rem;height:.8rem;stroke-width:5;flex:none}
.bar b{font-weight:600;color:var(--ink)}
.bar svg.ul{position:absolute;left:0;bottom:0;width:100%;height:.5rem;stroke-width:2}
.num b svg.ck{position:static;display:block;width:1.05em;height:.9em;stroke-width:9}

.t1{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:1.4rem;align-items:start}
.six{display:grid;gap:.45rem;margin-top:.7rem}
.six li{display:grid;grid-template-columns:auto 1fr;gap:.7rem;align-items:center;font-weight:600;font-size:1rem;line-height:1.3}
.six .num{width:2rem;height:2rem;font-size:1.3rem}
.d17{display:flex;flex-wrap:wrap;gap:.3rem;margin:.8rem 0 .5rem}
.d17 svg{width:1.35rem;height:1.35rem;stroke-width:5}
.d17 svg.on{fill:var(--red)}
.mini{font-size:.9375rem;color:var(--ink-2);line-height:1.5;margin-top:.3rem}
.mini li{padding-left:1.3rem;position:relative}
.mini li svg{position:absolute;left:0;top:.42em;width:.9rem;height:.6rem;stroke-width:4}

.t2{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,1fr);gap:1.4rem;align-items:start}
.l7{display:grid;gap:.05rem;margin-top:.3rem}
.l7 .rw{display:grid;grid-template-columns:minmax(0,8.6rem) 1fr;align-items:center;column-gap:.6rem;min-height:1.95rem}
.l7 .nm{font-size:.875rem;font-weight:600;line-height:1.2}
.l7 .rw.v .nm{font-weight:900;color:var(--red-ink)}
.l7 .trk{position:relative;height:1.6rem}
.l7 .trk svg.sg{position:absolute;top:50%;height:.9rem;translate:0 -50%}
.l7 .trk svg.nd{position:absolute;top:50%;width:1.05rem;height:1.05rem;translate:-50% -50%;stroke-width:5}
svg.nd.full{fill:var(--ink)}
svg.nd.full.red{fill:var(--red)}
svg.nd.open{fill:var(--board)}
.l7 .hd4{display:grid;grid-template-columns:minmax(0,8.6rem) 1fr;column-gap:.6rem;height:1.5rem}
.l7 .hd4 div{position:relative}
.l7 .hd4 div span{position:absolute;top:0;translate:-50% 0;font-family:var(--hand);font-size:1.3rem;line-height:1;color:var(--ink-2)}
.leg{font-family:var(--hand);font-size:1.15rem;line-height:1.2;color:var(--ink-2);margin-top:.5rem}
.leg b{font-weight:400;color:var(--red-ink)}
.crates{display:grid;gap:.5rem;margin-top:.7rem}
.crates li{display:grid;grid-template-columns:auto 1fr;gap:.6rem;align-items:center}
.crates svg.cr{width:1.9rem;height:1.6rem;stroke-width:3}
.crates span{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 .6rem}
.crates b{font-weight:600;font-size:.9375rem;line-height:1.25}

.t3{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:1.1rem 1.3rem;align-items:start}
.t3 .notes{grid-column:1 / -1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem}
.desc{font-size:.9375rem;line-height:1.5;margin-top:.6rem;color:var(--ink-2)}
.stamps{display:flex;flex-wrap:wrap;gap:.6rem .7rem;margin-top:.9rem}
.colz{display:grid;gap:.55rem;margin-top:.6rem}
.colz li{display:grid;grid-template-columns:minmax(0,6.2rem) 1fr;gap:.7rem;align-items:start;font-size:.9375rem;line-height:1.4}
.colz b{font-weight:600}
.colz span{color:var(--ink-2)}

.t4{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 4.6rem minmax(0,1fr);gap:.4rem;align-items:center}
.t4 svg.conn{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;stroke-width:2.5}
.t4 svg.conn path{stroke-dasharray:7 7}
.t4 .flowar{visibility:hidden}
.codes{display:grid;gap:.4rem}
.codes li{position:relative;padding:.3rem .8rem .35rem;font-size:.875rem;line-height:1.3;color:var(--ink-2)}
.codes li b{font-family:var(--hand);font-weight:400;font-size:1.3rem;color:var(--ink);margin-right:.4rem}
.codes .fr{stroke-width:2}
.flowar{display:grid;place-items:center}
.flowar svg{width:100%;height:2.4rem;stroke-width:4}
.bins{display:grid;gap:.5rem}
.bins li{position:relative;padding:.45rem .9rem .5rem;font-weight:600;font-size:1rem;line-height:1.3}
.bins .fr{stroke:var(--red);stroke-width:2.5}
.t4f{grid-column:1 / -1;display:flex;flex-wrap:wrap;align-items:center;gap:.6rem 1.2rem;margin-top:.9rem}

.strata{grid-column:1 / -1;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr);gap:.6rem;align-items:start;margin-top:1.2rem}

.strata svg.ar{width:1.8rem;height:1.1rem;stroke-width:4;margin-top:.25rem}
.strata b{display:block;font-weight:900;font-size:1.125rem;word-spacing:.14em}
.strata span{display:block;font-size:.9375rem;color:var(--ink-2);line-height:1.4}

.t6{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:1.4rem;align-items:start}
.terms{display:flex;flex-wrap:wrap;gap:.25rem .8rem;margin-top:.7rem}

.kv{display:grid;grid-template-columns:auto 1fr;gap:.25rem .8rem;font-size:.9375rem;line-height:1.4;margin-top:.8rem}

.t7{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:1.2rem 1.4rem;align-items:start}

.t8{display:grid;gap:1.1rem}

.t9{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:1.4rem;align-items:start}

.t9 .big{font-weight:900;font-size:1.5rem;line-height:1.25;word-spacing:.14em}

/* ingrandimento della schermata originale */
.zoom{position:fixed;inset:0;z-index:40;background:rgba(255,255,255,.97);display:grid;place-items:center;padding:2rem;opacity:0;visibility:hidden;transition:opacity .25s var(--ease),visibility 0s .25s}

/* ----- piccoli movimenti che vivono da soli ----- */
@keyframes drive{from{left:-9%}to{left:103%}}
@keyframes bob{from{translate:0 0}to{translate:0 -2px}}
@keyframes spin{to{rotate:360deg}}
@keyframes march{to{stroke-dashoffset:-30}}
@keyframes fog{from{translate:-7px 0}to{translate:7px 0}}
@keyframes grow{0%,100%{scale:1 1}50%{scale:1 .55}}
@keyframes lift{0%,62%,100%{rotate:0deg}72%,90%{rotate:-22deg}}
@keyframes sweep{from{rotate:-10deg}to{rotate:12deg}}
@keyframes hop{0%,70%,100%{translate:0 0}80%{translate:0 6px}90%{translate:0 2px}}
@keyframes sway{from{rotate:-3deg}to{rotate:3deg}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes retrace{0%,82%{clip-path:inset(-40% -4% -40% -4%)}83%{clip-path:inset(-40% 104% -40% -4%)}100%{clip-path:inset(-40% -4% -40% -4%)}}
@keyframes tickin{0%,8%{opacity:0;scale:.3}16%,100%{opacity:1;scale:1}}
@keyframes drop{0%,20%{translate:0 -14px;opacity:0}45%,85%{translate:0 0;opacity:1}100%{translate:0 0;opacity:0}}
@keyframes flow4{to{stroke-dashoffset:-14}}
@keyframes slide{0%{translate:-120% 0;opacity:0}15%{opacity:1}85%{opacity:1}100%{translate:120% 0;opacity:0}}
.sbus{animation:drive 26s linear infinite}
.sbus svg{animation:bob .5s ease-in-out infinite alternate}
.sbus .wh,.sbus .hub{transform-box:fill-box;transform-origin:center;animation:spin 1.2s linear infinite}
.road svg.dash path{animation:march 1.7s linear infinite}
.t4 svg.conn path{animation:flow4 1.2s linear infinite}
.dw .fogc{animation:fog 5.5s ease-in-out infinite alternate}
.dw .fogc.b{animation-duration:7s;animation-direction:alternate-reverse}
.dw .bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow 5s ease-in-out infinite}
.dw .bar.b2{animation-delay:-1.2s}.dw .bar.b3{animation-delay:-2.6s}.dw .bar.b4{animation-delay:-3.7s}
.dw .gate{transform-box:fill-box;transform-origin:0 100%;animation:lift 7s var(--ease) infinite}
.dw .tk{animation:drop 3.6s var(--ease) infinite}
.dw .stp{animation:tickin 7s var(--ease) infinite both}
.dw .crt{animation:blink 4.5s ease-in-out infinite}
.dw .crt.c2{animation-delay:-1.5s}.dw .crt.c3{animation-delay:-3s}
.dw .chart{animation:retrace 8s var(--ease) 1s infinite}
.dw .flag{transform-box:fill-box;transform-origin:0 50%;animation:sway 3.2s ease-in-out infinite alternate}
.ppl .lens{transform-box:fill-box;transform-origin:0 100%;animation:sweep 2.6s ease-in-out infinite alternate}
.ppl .crd{animation:bob 1.6s ease-in-out infinite alternate}
.ppl .crd.c2{animation-delay:-.5s}.ppl .crd.c3{animation-delay:-1s}
.nx svg{animation:hop 2.4s ease-in-out infinite}
.hd .circled svg{animation:retrace 11s var(--ease) 4s infinite}
.days .tks svg{animation:tickin 9s var(--ease) infinite both}
.flowar svg,.case svg.ar{animation:hop 3s ease-in-out infinite;rotate:0deg}
.t5 .pk{position:relative;overflow:hidden;height:2.4rem}
.t5 .pk svg.ar{position:absolute;left:0;top:50%;width:100%;height:1.6rem;translate:0 -50%;stroke-width:4}
.t5 .pk i{position:absolute;left:35%;top:50%;width:.8rem;height:.8rem;margin-top:-.4rem;animation:slide 3.4s linear infinite}
.t5 .pk i svg{display:block;width:100%;height:100%;stroke-width:6}
.trio svg .crd{animation:bob 1.8s ease-in-out infinite alternate}
html.still .sbus{left:47%}
html.still *,html.still *::before,html.still *::after{animation:none!important;transition-duration:.01ms!important;transition-delay:0s!important}

  .mx tbody th{font-size:.8125rem;padding-right:.3rem}

}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.01ms!important;transition-delay:0s!important}
  .sbus{left:47%}
}

<script>
/* aiuti per catture e stampa: ?fermo ferma i movimenti */
const STILL = /[?&]fermo/.test(location.search);
if(STILL) document.documentElement.classList.add("still");

/* ---------- segni a pennarello ---------- */
const FR = `<svg class="mk stretch fr" viewBox="0 0 300 200" preserveAspectRatio="none" aria-hidden="true"><path d="M4 7 C96 3 204 8 296 5"/><path d="M295 3 C297 66 295 134 296 197"/><path d="M298 195 C198 198 100 194 3 196"/><path d="M5 198 C3 132 5 66 4 3"/></svg>`;

const num = (n, cls="") => `<span class="num ${cls}">${RING}<b>${n}</b></span>`;

const ARB = `<svg class="mk red ar" viewBox="0 0 60 30" aria-hidden="true"><path d="M56 16 C42 13 26 18 8 15"/><path d="M20 5 C15 9 10 12 6 15 C10 19 15 22 19 26"/></svg>`;
const ARD = `<svg class="mk red" viewBox="0 0 50 50" aria-hidden="true"><path d="M40 6 C34 18 26 30 14 40"/><path d="M8 24 C9 30 10 36 11 42 C17 42 23 41 29 40"/></svg>`;
const ARU = `<svg class="mk red" viewBox="0 0 50 50" aria-hidden="true"><path d="M40 44 C34 32 26 20 14 10"/><path d="M8 26 C9 20 10 14 11 8 C17 8 23 9 29 10"/></svg>`;
const DASH = `<svg class="mk red" viewBox="0 0 20 10" aria-hidden="true"><path d="M2 6 C7 3 13 8 18 4"/></svg>`;
const node = (cls, st="") => `<svg class="mk nd ${cls}" style="${st}" viewBox="0 0 100 100" aria-hidden="true"><path d="M52 10 C26 8 10 28 11 52 C12 76 30 91 54 90 C76 89 91 72 90 48 C89 26 72 10 46 11"/></svg>`;

const man = (x, extra="") => `<g transform="translate(${x} 0)"><path class="paper" d="M30 8 C20 8 16 18 18 26 C20 34 28 38 34 36 C42 34 44 24 42 18 C40 10 34 8 28 9"/><path d="M30 38 L30 74"/><path d="M30 74 L19 104"/><path d="M30 74 L41 104"/>${extra}</g>`;
const el = (t, cls, html) => { const e=document.createElement(t); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; };

/* ---------- la scena ---------- */
let seen = new Set();
try { seen = new Set(JSON.parse(sessionStorage.getItem("tper-viste")||"[]")); } catch(e){}
const save = () => { try { sessionStorage.setItem("tper-viste", JSON.stringify([...seen])); } catch(e){} };

function build(){
  const lots = $("lots"), along = $("along");
  [1,2,3,4,5,6,9].forEach(id=>{
    const c = Q[id-1];
    const b = el("button","lot"); b.type = "button"; b.dataset.q = id; b.style.setProperty("--c", lots.querySelectorAll(".lot").length + 1);
    b.innerHTML = `<span class="nx hand">${ARD}<span class="nxt"></span></span>
      <span class="stage"><b>${c.st}</b><i>${c.gl}</i></span>
      <svg class="mk dw" viewBox="0 0 200 230" aria-hidden="true">${DRAW[id]}</svg>
      <span class="tile">${FR}<svg class="mk red str" viewBox="0 0 20 26" aria-hidden="true"><path d="M10 1 C7 9 13 16 10 25"/></svg>${id===9 ? `<span class="num">${RING}<b>${CK}</b></span>` : num(id)}<span class="qq">${c.qq}</span></span>
      <span class="done">${TICK}</span><span class="vh">. Apri la tavola<span class="st"></span></span>`;
    lots.appendChild(b);
  });
  along.innerHTML = `<span class="lbl hand">due domande accompagnano il dato per tutta la strada</span>`;
  [[7,PPL7,"s7"],[8,PPL8,"s8"]].forEach(([id,ppl,cls])=>{
    const c = Q[id-1];
    const b = el("button","strip "+cls); b.type = "button"; b.dataset.q = id;
    b.innerHTML = `${FR}<span class="nx hand">${ARU}<span class="nxt"></span></span>${ppl}${num(id)}<span class="qq">${c.qq}</span><span class="done">${TICK}</span><span class="vh">. Apri la tavola<span class="st"></span></span>`;
    along.appendChild(b);
  });
  $("dots").innerHTML = Array.from({length:LAST},(_,i)=>`<li data-d="${i+1}">${node("red")}<span class="vh">Domanda ${i+1}<span class="st"></span></span></li>`).join("");
  mark();
}
function mark(){
  let next = 0;
  for(let i=1;i<=LAST;i++) if(!seen.has(i)){ next = i; break; }
  if(!next) next = 9;
  document.querySelectorAll("[data-q]").forEach(b=>{
    const id = +b.dataset.q;
    b.classList.toggle("seen", seen.has(id));
    const s = b.querySelector(".st"); if(s) s.textContent = seen.has(id) ? ", già aperta" : "";
    b.classList.toggle("is-next", id===next && !seen.has(9));
    const t = b.querySelector(".nxt"); if(t) t.textContent = seen.size===0 ? "comincia da qui" : (id===9 ? "e adesso il capolinea" : "poi questa");
  });
  document.querySelectorAll("#dots li").forEach(li=>{ const on = seen.has(+li.dataset.d); li.classList.toggle("on", on); li.querySelector(".st").textContent = on ? ", aperta" : ", da aprire"; });
  const n = [...seen].filter(i=>i<=LAST).length;
  $("how").textContent = n===0 ? "otto domande: aprile in ordine" : (n<LAST ? `${n} di ${LAST} aperte` : "tutte aperte: resta il capolinea");
}

/* tavola 4: un tratto da ogni codice alla sua categoria */
const MAP4 = [0,0,1,1,2,3,4];
function connect(){
  const s = $("conn"); if(!s) return;
  const box = s.parentElement.getBoundingClientRect();
  const cs = [...s.parentElement.querySelectorAll(".codes li")], bs = [...s.parentElement.querySelectorAll(".bins li")];
  if(!box.width || !cs.length) return;
  s.setAttribute("viewBox", `0 0 ${box.width} ${box.height}`);
  s.innerHTML = cs.map((c,i)=>{
    const a = c.getBoundingClientRect(), b = bs[MAP4[i]].getBoundingClientRect();
    const x1 = a.right - box.left + 4, y1 = a.top + a.height/2 - box.top, x2 = b.left - box.left - 5, y2 = b.top + b.height/2 - box.top + (i%2 ? 4 : -4), m = (x1+x2)/2;
    return `<path d="M${x1} ${y1} C${m} ${y1} ${m} ${y2} ${x2} ${y2}"/>`;
  }).join("");
}
addEventListener("resize", connect);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(connect);

/* ---------- la tavola ---------- */
let cur = null, opener = null;
function render(id){
  const c = Q[id-1];
  const roles = c.roles.map(r=>ROLE[r][0]).join(c.roles.length>2 ? ", " : " e ");
  const prev = id>1 ? id-1 : null, next = id<9 ? id+1 : null;
  $("plate").innerHTML = `<div class="pl">
    <button class="x" id="pl-close" type="button" aria-label="Torna alla scena"><span>torna alla scena</span><svg class="mk" viewBox="0 0 40 40" aria-hidden="true"><path d="M7 8 C16 16 25 25 33 33"/><path d="M33 7 C24 16 15 25 7 33"/></svg></button>
    <aside class="pl-txt">
      <div class="pl-top">${id===9 ? `<span class="num big">${RING}<b>${CK}</b></span>` : num(id,"big")}${id===7 ? PPL7 : id===8 ? PPL8 : `<svg class="mk dw" viewBox="0 0 200 230" aria-hidden="true">${DRAW[id]}</svg>`}</div>
      <h2 id="pl-q" tabindex="-1">${c.q}</h2>
      <p class="ans">${c.a}</p>
      ${c.roles.length ? `<p class="who">${FR}<b>ne ${c.roles.length>1?"rispondono":"risponde"}</b><span>${roles}</span></p>` : ""}
      <div class="pl-nav">
        ${prev ? `<button class="nb bk" type="button" data-go="${prev}">${FR}${ARB}Domanda ${prev}</button>` : `<button class="nb bk" type="button" data-home>${FR}${ARB}Alla scena</button>`}
        ${next ? `<button class="nb fw" type="button" data-go="${next}">${FR}${next===9?"Capolinea":"Domanda "+next}${AR()}</button>` : `<button class="nb fw" type="button" data-go="1">${FR}Ricomincia dalla prima${AR()}</button>`}
      </div>
      ${c.orig ? `<button class="orig" type="button" data-orig="img/${c.orig[0]}" data-cap="${esc(c.orig[1])}">vedi la schermata originale</button>` : ""}
    </aside>
    <div class="fig">${FR}<span class="cap hand">${c.st}, ${c.gl}</span>${FIG[id](c)}</div>
  </div>`;
}
function open(id, from){
  const p = $("plate");
  if(from){ const r = from.getBoundingClientRect(); p.style.setProperty("--ox", (r.left+r.width/2)+"px"); p.style.setProperty("--oy", (r.top+r.height/2)+"px"); opener = from; }
  const was = cur!==null;
  cur = id; render(id);
  p.scrollTop = 0; p.inert = false; p.classList.add("open");
  document.documentElement.style.overflow = "hidden";
  requestAnimationFrame(connect);
  $("hd").inert = true; $("scene").inert = true;
  seen.add(id); save(); mark();
  setTimeout(()=>{ const h = $("pl-q"); if(h) h.focus({preventScroll:true}); }, was ? 0 : 120);
}
function close(){
  if(cur===null) return;
  const p = $("plate"); const id = cur; cur = null;
  p.classList.remove("open"); p.inert = true;
  document.documentElement.style.overflow = "";
  $("hd").inert = false; $("scene").inert = false;
  const back = document.querySelector(`#scene [data-q="${id}"]`) || opener;
  if(back) back.focus({preventScroll:true});
}
/* l'indirizzo è la sola fonte di verità: Indietro richiude la tavola */
const parse = () => { const m = location.hash.match(/^#d([1-9])$/); return m ? +m[1] : null; };
let pendingFrom = null;
function apply(){ const id = parse(); if(id) open(id, pendingFrom); else close(); pendingFrom = null; }
function go(id, from, replace){
  const h = id ? "#d"+id : "#";
  pendingFrom = from || null;
  if(replace){ history.replaceState(null,"",h); apply(); }
  else if((location.hash||"#")===h || (!id && !location.hash)) apply();
  else location.hash = h;
}
addEventListener("hashchange", apply);

/* ---------- la schermata originale, su richiesta ---------- */
let zFrom = null;
function openZoom(btn){
  zFrom = btn;
  let im = $("z-img");
  if(!im){ im = document.createElement("img"); im.id = "z-img"; $("zf").prepend(im); }
  im.src = btn.dataset.orig; im.alt = btn.dataset.cap;
  $("z-cap").textContent = btn.dataset.cap;
  const z = $("zoom"); z.inert = false; z.classList.add("open"); $("plate").inert = true;
  setTimeout(()=>$("z-close").focus(), 60);
}
function closeZoom(){
  const z = $("zoom"); if(!z.classList.contains("open")) return false;
  z.classList.remove("open"); z.inert = true; $("plate").inert = false;
  if(zFrom && zFrom.isConnected) zFrom.focus({preventScroll:true});
  zFrom = null; return true;
}

document.addEventListener("click", e=>{
  const o = e.target.closest("[data-orig]"); if(o){ openZoom(o); return; }
  if(e.target.closest("#zoom")){ closeZoom(); return; }
  if(e.target.closest("#pl-close") || e.target.closest("[data-home]")){ go(null); return; }
  const g = e.target.closest("[data-go]"); if(g && g.dataset.go){ go(+g.dataset.go, null, true); return; }
  const q = e.target.closest("#scene [data-q]"); if(q){ go(+q.dataset.q, q); return; }
});
document.addEventListener("keydown", e=>{
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  if(e.key==="Escape"){ if(!closeZoom() && cur!==null) go(null); return; }
  if(cur===null || $("zoom").classList.contains("open")) return;
  if(e.key==="ArrowRight" || e.key==="PageDown"){ if(cur<9){ go(cur+1, null, true); e.preventDefault(); } }
  else if(e.key==="ArrowLeft" || e.key==="PageUp"){ if(cur>1){ go(cur-1, null, true); e.preventDefault(); } }
});

const qv = location.search.match(/[?&]viste=([\d,]+)/);
if(qv) seen = new Set(qv[1].split(",").map(Number));
const qd = location.search.match(/[?&]d=([1-9])/);
if(qd && !location.hash) history.replaceState(null, "", location.pathname + location.search + "#d" + qd[1]);
build();
apply();
if(/[?&]orig/.test(location.search)){ const o = document.querySelector("[data-orig]"); if(o) openZoom(o); }
</script>
